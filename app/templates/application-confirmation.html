{% extends "authenticated-base.html" %}
{% block title %}Application submitted | MyIntern{% endblock %}

{% block subpage_content %}
<div class="container-fluid py-2">
  <div class="card border-0 shadow-sm p-4" style="max-width: 720px;">
    <div class="display-6 text-success mb-3">✓</div>
    <h1 class="h3">Application submitted</h1>
    <p class="text-muted">Your application reference is <strong>{{ application.application_reference }}</strong>.</p>
    <p class="mb-0">Current status: <span class="badge text-bg-secondary">{{ application.status|capitalize }}</span></p>
  </div>
</div>
{% endblock %}
